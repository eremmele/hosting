<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pay Now</title>
    <style>
      body {
        margin: 0;
        background: #f8f8f8;
        font-family: "Rund Display Bold", sans-serif;
      }

      iframe {
        width: 100vw;
        height: 100vh;
        border: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        background: white;
      }

      #shadow-mask {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100vw;
        height: 40px; /* tweak this to fully hide shadow */
        background: white;
        z-index: 1001;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <iframe
      id="payment-frame"
      src="https://payment.ipospays.com/api/v2/merchantPay?t=..."
    ></iframe>

    <div id="shadow-mask"></div>

    <script>
      // If iPOS ever supports postMessage, hook here
      const iframe = document.getElementById("payment-frame");

      window.addEventListener("message", (event) => {
        console.log("Received message from iframe:", event.data);
      });
    </script>
  </body>
</html>
